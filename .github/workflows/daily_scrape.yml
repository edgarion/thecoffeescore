name: Daily Coffee Scraper & AI Validation Agent

on:
  schedule:
    # 07:00 UTC = 09:00 AM Europe/Madrid (Madrid Summer/Standard Time)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    name: Run The Coffee Score ETL Agent

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f thecoffeescore-agent/requirements.txt ]; then
            pip install -r thecoffeescore-agent/requirements.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Execute Daily Coffee ETL Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          cd thecoffeescore-agent
          python main.py

      - name: Commit and Push Updated Scraped Catalog & Images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add thecoffeescore-agent/output/
          
          # Only commit if there are new changes
          if ! git diff --staged --quiet; then
            git commit -m "chore(agent): automated daily 09:00 AM coffee scraping & AI validation [skip ci]"
            git push
          else
            echo "No new catalog changes to commit."
          fi
